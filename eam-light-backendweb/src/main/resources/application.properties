server.port=8080
server.servlet.context-path=/apis/eamlightws

# Standalone database configuration (placeholder - can be overridden via env variables)
spring.datasource.url=${EAMLIGHT_DB_URL:jdbc:oracle:thin:@localhost:1521/XE}
spring.datasource.username=${EAMLIGHT_DB_USER:asbmgr}
spring.datasource.password=${EAMLIGHT_DB_PASS:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
